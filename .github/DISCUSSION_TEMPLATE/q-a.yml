title: "[Question] "
body:
  - type: markdown
    attributes:
      value: "Ask about using or building RTP. For reproducible software bugs, use Issues. Never paste credentials, env files or device tokens."
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, OS and browser or app version
      description: For example, browser website, Android alpha or Windows alpha.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include the route and relevant error text with private details removed.
