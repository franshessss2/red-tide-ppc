name: PR57 verification

on:
  push:
    branches: [arena/pr57-wave-loop-intro]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/pr57-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pr57-vite.log
          exit 1
      - name: Browser verification
        id: browser
        continue-on-error: true
        run: node scripts/pr57-browser-pass.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Build standalone preview
        if: always()
        run: node scripts/pr57-standalone-preview.mjs

      - name: Upload PR57 verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr57-verification-${{ github.sha }}
          path: |
            pr57-artifacts
            pr57-standalone-preview.html
          retention-days: 7
          if-no-files-found: warn

      - name: Fail when browser verification failed
        if: always() && steps.browser.outcome != 'success'
        run: |
          echo "PR57 browser verification failed; see pr57-artifacts and the browser step output."
          exit 1
