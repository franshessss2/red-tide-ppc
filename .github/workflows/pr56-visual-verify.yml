name: PR56 temporary visual verification
on:
  push:
    branches:
      - arena/pr56-surface-continuity
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/pr56-browser-pass.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr56-frames
          path: qa/pr56
          if-no-files-found: warn
